name: Validate portfolio

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      with_gurobi:
        description: Run optional Gurobi backend tests (requires an available license)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MPLBACKEND: Agg
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install core and test dependencies (no solver)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
          python -c "import importlib.util; assert importlib.util.find_spec('gurobipy') is None"
      - name: Chronology, leakage, reproduction and demo tests
        run: python -m pytest -m "not gurobi" --junitxml="$RUNNER_TEMP/core-tests.xml"
      - name: Reconcile saved historical artifacts without a solver
        run: python bike_sharing.py --verify --report-file "$RUNNER_TEMP/verification.json"
      - name: Confirm tests preserve saved files
        run: git diff --exit-code

  optional-solver:
    if: github.event_name == 'workflow_dispatch' && inputs.with_gurobi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-gurobi.txt
      - run: python -m pytest -m gurobi
